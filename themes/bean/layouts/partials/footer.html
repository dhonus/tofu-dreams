<script>
    // Smooth-scroll for same-page anchor links (e.g. "Jump to recipe"). Done in JS
    // rather than CSS `scroll-behavior: smooth` so it never animates the browser's
    // scroll restoration on reload (which made tall pages creep down each refresh).
    (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a[href^="#"]');
            if (!a) return;
            var id = a.getAttribute('href').slice(1);
            if (!id) return;
            var target = document.getElementById(id);
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.replaceState(null, '', '#' + id);
        });
    })();
</script>

<script>
    // Progressive enhancement: scroll-reveal + count-up.
    // If JS is off or motion is reduced, nothing is hidden and content shows as-is.
    (function () {
        // Only runs when <head> enabled it (IO present, motion allowed).
        if (!document.documentElement.classList.contains('reveal-on')) return;

        var targets = document.querySelectorAll('.section-head, .category, .teaser_container, .tagcloud-container');
        if (!targets.length) return;
        // On phones, pre-trigger below the fold so cards are already revealing by the
        // time they scroll into view (fast scrolling made the -4% delay feel late).
        var phone = window.matchMedia('(max-width: 700px)').matches;
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) {
                    e.target.classList.add('is-visible');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.01, rootMargin: phone ? '0px 0px 18% 0px' : '0px 0px -4% 0px' });
        targets.forEach(function (el) { io.observe(el); });
    })();
</script>

<script> // let's save the state of checkboxes, so that we can reload the site
    function saveCheckboxesState() {
        const page_url = window.location.href;
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const checkboxes_state = {};
        for (let i = 0; i < checkboxes.length; i++) {
            if (checkboxes[i].id === 'wakeLockCheckbox') {
                continue;
            }
            checkboxes[i].id = 'checkbox-' + i; // add ordinal id
            const checkbox = checkboxes[i];
            checkboxes_state[checkbox.id] = checkbox.checked;
        }
        sessionStorage.setItem(page_url, JSON.stringify(checkboxes_state));
    }
    function loadCheckboxesState() {
        const page_url = window.location.href;
        const checkboxes_state = JSON.parse(sessionStorage.getItem(page_url));
        if (checkboxes_state) {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].id === 'wakeLockCheckbox') {
                    continue;
                }
                checkboxes[i].id = 'checkbox-' + i; // add ordinal id
                const checkbox = checkboxes[i];
                checkbox.checked = checkboxes_state[checkbox.id];
            }
        }
    }
    window.addEventListener('load', loadCheckboxesState);
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    for (let i = 0; i < checkboxes.length; i++) {
        const checkbox = checkboxes[i];
        checkbox.addEventListener('click', saveCheckboxesState);
    }
</script>

<script>
    // make every image inside div.image-split clickable and open it in a large preview modal
    // make every image inside div.image-split clickable and open it in a large preview modal
    const imageSplitDivs = document.querySelectorAll('div.image-split');

    imageSplitDivs.forEach((imageSplitDiv) => {
        const images = imageSplitDiv.querySelectorAll('p img');

        images.forEach((image) => {
            image.addEventListener('click', function () {
                const modal = document.createElement('div');
                modal.classList.add('image-modal');
                modal.innerHTML = '<div class="modal-content"><span class="close">&times;</span><img src="' + image.src + '"></div>';
                document.body.appendChild(modal);

                setTimeout(function () {
                    modal.classList.add('visible');
                }, 10);

                const modalContent = modal.querySelector('.modal-content');
                const modalImage = modal.querySelector('img');

                modalImage.addEventListener('click', function (event) {
                    event.stopPropagation();
                });
                const close = modal.querySelector('.close');
                close.addEventListener('click', function () {
                    modal.classList.remove('visible');
                    setTimeout(function () {
                        modal.remove();
                    }, 100);
                });
                modalImage.addEventListener('click', function () {
                    modal.classList.remove('visible');
                    setTimeout(function () {
                        modal.remove();
                    }, 100);
                });
            });
        });
    });

</script>
