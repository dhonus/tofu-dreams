<div id="nav-border" class="container">
    <nav id="nav">
        <a class="brand" href="{{ absURL "/" }}">
            <img src="{{.Site.BaseURL}}{{ .Site.Params.logo }}" class="logo" alt="{{ .Site.Title }} logo"/>
            <span class="brand-text">
                <span class="brand-name">{{ .Site.Title }}</span>
                <span class="brand-tag">{{ .Site.Params.description }}</span>
            </span>
        </a>

        <div class="nav-search" id="navSearch" data-index="{{ with .Site.Home.OutputFormats.Get "json" }}{{ .RelPermalink }}{{ end }}" hidden>
            <svg class="nav-search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="siteSearch" class="nav-search-input" placeholder="Search recipes…" autocomplete="off" aria-label="Search recipes">
            <kbd class="nav-search-kbd" aria-hidden="true">/</kbd>
            <div class="nav-search-results" id="siteSearchResults" role="listbox"></div>
        </div>

        <nav class="nav-menu">
            {{ range .Site.Menus.main }}
                <a class="nav-link{{ if eq $.RelPermalink .URL }} active{{ end }}" href="{{ absURL .URL }}">{{ .Name }}</a>
            {{ end }}
            <a class="nav-link{{ if eq $.RelPermalink "/about/" }} active{{ end }}" href="{{ absURL "/about" }}">About</a>
        </nav>
    </nav>
</div>

<script>
    // Global recipe search — fetches the static /index.json once, filters in-browser.
    // Progressive enhancement: the whole search box is hidden until this runs.
    (function () {
        var wrap = document.getElementById('navSearch');
        if (!wrap) return;
        var input = document.getElementById('siteSearch');
        var results = document.getElementById('siteSearchResults');
        var indexUrl = wrap.getAttribute('data-index');
        if (!indexUrl) return;
        wrap.hidden = false;

        // Portal the results out of the (overflow-clipped) sticky nav so the
        // dropdown isn't clipped. It's positioned from the input's rect on open.
        document.body.appendChild(results);

        var data = null, loading = false, active = -1;

        function esc(s) {
            return (s || '').replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }
        function load() {
            if (data || loading) return;
            loading = true;
            fetch(indexUrl).then(function (r) { return r.json(); }).then(function (j) {
                data = j; loading = false;
                if (input.value) run(input.value);
            }).catch(function () { loading = false; });
        }
        function position() {
            var r = input.getBoundingClientRect();
            results.style.left = r.left + 'px';
            results.style.width = r.width + 'px';
            results.style.top = (r.bottom + 8) + 'px';
        }
        function open() { position(); results.classList.add('is-open'); }
        function close() { results.classList.remove('is-open'); active = -1; }

        function run(q) {
            q = q.trim().toLowerCase();
            if (!q) { close(); return; }
            if (!data) { load(); results.innerHTML = '<div class="search-empty">Loading recipes…</div>'; open(); return; }

            var scored = [];
            data.forEach(function (item) {
                var title = (item.title || '').toLowerCase();
                var tags = (item.tags || []).join(' ').toLowerCase();
                var hay = title + ' ' + (item.summary || '').toLowerCase() + ' ' + tags;
                if (hay.indexOf(q) === -1) return;
                var score = title.indexOf(q) === 0 ? 0 : (title.indexOf(q) !== -1 ? 1 : (tags.indexOf(q) !== -1 ? 2 : 3));
                scored.push({ item: item, score: score });
            });
            scored.sort(function (a, b) { return a.score - b.score; });
            var top = scored.slice(0, 6).map(function (s) { return s.item; });
            active = -1;

            if (!top.length) {
                results.innerHTML = '<div class="search-empty">No recipes for “' + esc(q) + '”.</div>';
            } else {
                results.innerHTML = top.map(function (it) {
                    var thumb = it.image
                        ? '<span class="sr-thumb" style="background-image:url(' + esc(it.image) + ')"></span>'
                        : '<span class="sr-thumb sr-thumb-empty"></span>';
                    var tags = (it.tags || []).slice(0, 3).map(function (t) {
                        return '<span class="sr-tag">' + esc(t) + '</span>';
                    }).join('');
                    return '<a class="sr-item" role="option" href="' + esc(it.url) + '">' +
                        thumb + '<span class="sr-body"><span class="sr-title">' + esc(it.title) +
                        '</span><span class="sr-tags">' + tags + '</span></span></a>';
                }).join('');
            }
            open();
        }
        function move(dir) {
            var items = results.querySelectorAll('.sr-item');
            if (!items.length) return;
            active = (active + dir + items.length) % items.length;
            items.forEach(function (el, i) { el.classList.toggle('is-active', i === active); });
            items[active].scrollIntoView({ block: 'nearest' });
        }

        input.addEventListener('focus', load);
        input.addEventListener('input', function () { run(input.value); });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
            else if (e.key === 'Enter') {
                var items = results.querySelectorAll('.sr-item');
                if (active >= 0 && items[active]) { e.preventDefault(); location.href = items[active].getAttribute('href'); }
            } else if (e.key === 'Escape') { input.value = ''; close(); input.blur(); }
        });
        document.addEventListener('click', function (e) {
            if (!wrap.contains(e.target) && !results.contains(e.target)) close();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== input &&
                !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement.tagName || ''))) {
                e.preventDefault(); input.focus();
            }
        });
        // keep the portaled dropdown aligned to the input as the layout shifts
        window.addEventListener('resize', function () { if (results.classList.contains('is-open')) position(); });
        window.addEventListener('scroll', function () { if (results.classList.contains('is-open')) position(); }, { passive: true });
    })();

    // Slim the sticky bar while scrolling (mobile): collapse the search row away
    // once you're past the top, but keep it while the search is focused.
    (function () {
        var nb = document.getElementById('nav-border');
        if (!nb) return;
        var input = document.getElementById('siteSearch');
        var on = false;
        function update() {
            var y = window.scrollY;
            // hysteresis: collapse past 90, only re-expand below 40. The dead zone
            // stops jitter at the boundary from restarting the animation.
            var next = on ? y > 40 : y > 90;
            if (input && document.activeElement === input) next = false;
            if (next !== on) { on = next; nb.classList.toggle('nav-collapsed', on); }
        }
        window.addEventListener('scroll', update, { passive: true });
        document.addEventListener('focusout', update);
        document.addEventListener('focusin', update);
        update();
    })();
</script>
